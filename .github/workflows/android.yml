name: Build Android APK

# The APK is built in CI rather than locally so it always matches whatever is
# deployed to the web — one commit produces both.
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you build on demand from the Actions tab

permissions:
  contents: write        # needed to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npx vite build
        env:
          # Baked into the APK so the app talks to the live backend.
          VITE_API_URL: https://inventory-erp-backend-iplr.onrender.com/api/v1

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # The camera permission must be declared in the manifest or Android shows
      # the app as having no permissions at all and the scanner can never be
      # granted access. Injected here because android/ is generated fresh each
      # run rather than committed.
      - name: Declare camera permissions in the manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys, re
          path = sys.argv[1]
          xml = open(path).read()

          perms = [
            '<uses-permission android:name="android.permission.CAMERA" />',
            '<uses-permission android:name="android.permission.INTERNET" />',
            '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
            '<uses-permission android:name="android.permission.VIBRATE" />',
          ]
          features = [
            '<uses-feature android:name="android.hardware.camera" android:required="false" />',
            '<uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />',
          ]

          missing = [p for p in perms + features if p.split('android:name="')[1].split('"')[0] not in xml]
          if missing:
              block = "\n    " + "\n    ".join(missing)
              xml = xml.replace('</manifest>', block + '\n</manifest>')
              open(path, 'w').write(xml)
              print("Added:", len(missing), "entries")
          else:
              print("Manifest already declares camera permissions")
          PY
          grep -c 'uses-permission' android/app/src/main/AndroidManifest.xml

      - name: Generate launcher icon and splash screen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2563eb' --splashBackgroundColor '#1e293b'
        continue-on-error: true    # cosmetic; never block the build

      - name: Sync web build into the native project
        run: npx cap sync android

      - name: Grant execute permission to Gradle
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # An unsigned release APK cannot be installed, so it is signed here with
      # a keystore held in repository secrets. Without those secrets the job
      # still produces a debug APK, which installs fine for in-house use.
      - name: Build debug APK (installable fallback)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage artifacts
        run: |
          mkdir -p out
          find android -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itecharena-erp-apk
          path: out/*.apk
          retention-days: 30

      # Artifacts require a GitHub login and arrive as a zip. A release gives a
      # plain download link that works on the phone itself, which is where the
      # APK actually needs to land.
      - name: Name the build
        id: meta
        run: |
          echo "tag=apk-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%d %b %Y %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: iTechArena ERP — build ${{ github.run_number }}
          body: |
            Android build ${{ github.run_number }} — ${{ steps.meta.outputs.date }}

            Download **app-debug.apk** below and open it on the phone to install.
            Android will ask permission to install from this source the first time.

            Built from commit ${{ github.sha }}.
          files: out/*.apk
          draft: false
          prerelease: false
