name: Build Android APK

# The APK is built in CI rather than locally so it always matches whatever is
# deployed to the web — one commit produces both.
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you build on demand from the Actions tab

permissions:
  contents: write        # needed to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's Ubuntu runners ship with the Android SDK already installed.
      # android-actions/setup-android@v3 started failing on every run from
      # 16 Sep 2026 (Node 20 retirement), which stopped all APK builds — so the
      # preinstalled SDK is used directly instead.
      - name: Use the runner's Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" | tail -5

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npx vite build
        env:
          # Baked into the APK so the app talks to the live backend.
          VITE_API_URL: https://inventory-erp-backend-iplr.onrender.com/api/v1

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # The camera permission must be declared in the manifest or Android shows
      # the app as having no permissions at all and the scanner can never be
      # granted access. Injected here because android/ is generated fresh each
      # run rather than committed.
      - name: Declare camera permissions in the manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys, re
          path = sys.argv[1]
          xml = open(path).read()

          perms = [
            '<uses-permission android:name="android.permission.CAMERA" />',
            '<uses-permission android:name="android.permission.INTERNET" />',
            '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
            '<uses-permission android:name="android.permission.VIBRATE" />',
            '<uses-permission android:name="android.permission.USE_BIOMETRIC" />',
          ]
          features = [
            '<uses-feature android:name="android.hardware.camera" android:required="false" />',
            '<uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />',
          ]

          missing = [p for p in perms + features if p.split('android:name="')[1].split('"')[0] not in xml]
          if missing:
              block = "\n    " + "\n    ".join(missing)
              xml = xml.replace('</manifest>', block + '\n</manifest>')
              open(path, 'w').write(xml)
              print("Added:", len(missing), "entries")
          else:
              print("Manifest already declares camera permissions")
          PY
          grep -c 'uses-permission' android/app/src/main/AndroidManifest.xml

      # Links the app to inventoryhss.netlify.app so Google Password Manager
      # offers the password saved on desktop inside the app, and saves new
      # ones for both. Must match public/.well-known/assetlinks.json.
      - name: Link app to website for saved passwords
        run: |
          python3 - <<'PY'
          import re
          sp = 'android/app/src/main/res/values/strings.xml'
          s = open(sp).read()
          if 'asset_statements' not in s:
              stmt = '[{\\"include\\": \\"https://inventoryhss.netlify.app/.well-known/assetlinks.json\\"}]'
              s = s.replace('</resources>', f'    <string name="asset_statements" translatable="false">{stmt}</string>\n</resources>')
              open(sp, 'w').write(s)
          mp = 'android/app/src/main/AndroidManifest.xml'
          m = open(mp).read()
          if 'asset_statements' not in m:
              m = re.sub(r'(<application[^>]*>)', r'\1\n        <meta-data android:name="asset_statements" android:resource="@string/asset_statements" />', m, count=1)
              open(mp, 'w').write(m)
          print('asset statements linked')
          PY

      # Every build must be signed with the SAME key. The runner otherwise makes
      # a fresh debug key per run, so a new APK won't install over the old one,
      # fingerprint sign-in is lost on reinstall, and the website link breaks.
      - name: Use the fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Fixed signing key installed"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — APK signed with a throwaway key"
          fi

      - name: Generate launcher icon and splash screen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2563eb' --splashBackgroundColor '#1e293b'
        continue-on-error: true    # cosmetic; never block the build

      - name: Sync web build into the native project
        run: npx cap sync android

      - name: Grant execute permission to Gradle
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # An unsigned release APK cannot be installed, so it is signed here with
      # a keystore held in repository secrets. Without those secrets the job
      # still produces a debug APK, which installs fine for in-house use.
      - name: Build debug APK (installable fallback)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage artifacts
        run: |
          mkdir -p out
          find android -name '*.apk' -exec cp {} out/ \;
          ls -la out

      # Gradle does not reliably pick up the keystore from ~/.android, so the
      # installable APK is re-signed explicitly with the fixed key. This is what
      # keeps updates installing over each other, keeps fingerprint sign-in
      # after an update, and matches the website's assetlinks.json.
      - name: Sign the APK with the fixed key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::no fixed key — skipping"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/itecharena.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks /tmp/itecharena.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android out/app-debug.apk
          "$BT/apksigner" verify --print-certs out/app-debug.apk | grep -i sha-256
          rm -f /tmp/itecharena.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itecharena-erp-apk
          path: out/*.apk
          retention-days: 30

      # Artifacts require a GitHub login and arrive as a zip. A release gives a
      # plain download link that works on the phone itself, which is where the
      # APK actually needs to land.
      - name: Name the build
        id: meta
        run: |
          echo "tag=apk-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%d %b %Y %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: iTechArena ERP — build ${{ github.run_number }}
          body: |
            Android build ${{ github.run_number }} — ${{ steps.meta.outputs.date }}

            Download **app-debug.apk** below and open it on the phone to install.
            Android will ask permission to install from this source the first time.

            Built from commit ${{ github.sha }}.
          files: out/*.apk
          draft: false
          prerelease: false
